
    <div class="table-filter" *ngIf="enableInternalFilter">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Filter this table</mat-label>
        <input matInput [(ngModel)]="filterText" (ngModelChange)="filterChanged()" placeholder="Type to filter rows">
      </mat-form-field>
    </div>

    <div class="table-wrap" *ngIf="filteredRows.length; else noRows">
      <table mat-table [dataSource]="visibleRows" class="full-table">
        <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
          <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
          <td mat-cell *matCellDef="let row">
            <ng-container [ngSwitch]="column.type">
              <img *ngSwitchCase="'image'" class="table-avatar" [src]="row[column.key]" [alt]="row.name">
              <span *ngSwitchCase="'status'" class="status"
                [class.dead]="row[column.key] === 'Dead'"
                [class.unknown]="row[column.key] === 'unknown'">{{ row[column.key] }}</span>
              <span *ngSwitchDefault>{{ row[column.key] ?? '—' }}</span>
            </ng-container>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"
          (click)="rowClick.emit(row)" [class.clickable]="rowClickable"></tr>
      </table>
    </div>
    <ng-template #noRows><div class="empty">No records found.</div></ng-template>

    <mat-paginator
      [length]="filteredRows.length"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50]"
      showFirstLastButtons
      (page)="pageChanged($event)">
    </mat-paginator>
